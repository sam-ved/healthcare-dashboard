version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./healthcare-backend
    depends_on:
      - db
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db?schema=public
      - JWT_SECRET=supersecretjwt
    ports:
      - "3000:3000"

  frontend:
    build: ./healthcare-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata: